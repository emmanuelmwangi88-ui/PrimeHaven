<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="/bootstrap/css/register.css">
</head>
<body>
<div class="form">
    <form action="">

        <legend > Join us and start your journey today!!!</legend><br>

        <label for="fname">First name:</label><br>
        <input type="text" id="fname" name="fname" placeholder="enter your name" required><br>

        <label for="lname">Last name:</label><br>
        <input type="text" id="lname" name="lname" placeholder="enter your last name" required><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" placeholder="enter your email" required><br>

        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password" placeholder="enter your password" required><br>

        <label for="phonenumber" >Phone Number:</label><br>
        <input type="tel" id="phonenumber" name="phonenumber" placeholder="+254 xxx xxx xxx" required><br>
        
        <label for="yob" >Year Of Birth:</label><br>
        <input type="date" id="yob" name="yob" placeholder="08/06/2000" required><br>

        <label for="file">upload your cv below:</label><br>
        <input type="file" id="file" name="file"><br>

        <label for="nationality" >Nationality:</label>
        <!---Dropdown----->

        <select name="" id="nationality">
            <option value="">Select Nationality</option>
            <option value="Kenyan">Kenyan</option>
            <option value="Ugandan">Ugandan</option>
            <option value="Tanzanian">Tanzanian</option>
            <option value="Rwandan">Rwandan</option>
            <option value="Burundian">Burundian</option>
        </select>

        <br>

        <label for="gender">Gender:</label><br>
<div id="gender">
    <label for="male">Male</label><br>
     <input type="radio" id="male" name="gender" value="male">

    <label for="female">Female</label><br>
    <input type="radio" id="female" name="gender" value="female">

    <label for="other">Other</label><br>
    <input type="radio" id="other" name="gender" value="other">

</div>

<br>
<div class="checkbox">
    <label for="choose web programming languages">Choose Web Programming Languages:</label>
    <input type="checkbox" id="html" name="html" value="html">
    <label for="html">HTML</label><br>
    <input type="checkbox" id="css" name="css" value="css">
    <label for="css">CSS</label><br>
    <input type="checkbox" id="javascript" name="javascript" value="javascript">
    <label for="javascript">JavaScript</label><br>
    <input type="checkbox" id="php" name="php" value="php">
    <label for="php">PHP</label><br>
    <input type="checkbox" id="python" name="python" value="python">
    <label for="python">Python</label><br>

    <label for="message">Message:</label><br>
    <textarea id="message" cols="40" rows="3" placeholder="Your message here..."></textarea><br>
</div>

        <button type="submit">Register</button>

      </form>
</div>
    
</body>
<script>
     const form = document.getElementById("registerForm");
    let clicked = false; // ensures message shows only once

    form.addEventListener("submit", function(event) {
        event.preventDefault();
        if (!clicked) {
            alert("Register successful!");
            window.location.href = "index.html";
            clicked = true;
        } else {
            alert("You have already registered.");
            
        }
    });
</script>

</html>
