<!--table colspan and rowspan-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Academic Grades Table</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #2c3e50;
    }
    caption {
      font-size: 1.2em;
      font-weight: bold;
      margin-bottom: 10px;
    }
    table {
      width: 80%;
      margin: 20px auto;
      border-collapse: collapse;
      background-color: #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    th, td {
      border: 1px solid #333;
      padding: 10px;
      text-align: center;
    }
    th {
      background-color: #2ecc71;
      color: white;
    }
    tr:nth-child(even) {
      background-color: #ecf0f1;
    }
  </style>
</head>
<body>
  <h1>Academic Performance Comparison</h1>
  <table>
    <caption>Academic Grades</caption>
    <tr>
      <th>Subject</th>
      <th>Type</th>
      <th>John Doe</th>
      <th>Miriam Luthier</th>
    </tr>
    <tr>
      <td rowspan="2">Biology</td>
      <td>Practical</td>
      <td>A</td>
      <td>A</td>
    </tr>
    <tr>
      <td>Theory</td>
      <td>A+</td>
      <td>A</td>
    </tr>
    <tr>
      <td rowspan="2">Chemistry</td>
      <td>Practical</td>
      <td>B</td>
      <td>C+</td>
    </tr>
    <tr>
      <td>Theory</td>
      <td>A</td>
      <td>C+</td>
    </tr>
    <tr>
      <td rowspan="2">Physics</td>
      <td>Practical</td>
      <td>A-</td>
      <td>A</td>
    </tr>
    <tr>
      <td>Theory</td>
      <td>A+</td>
      <td>B</td>
    </tr>
    <tr>
        <td rowspan="2">Mathematics</td>
        <td>Practical</td>
        <td>C-</td>
        <td>C</td>
      </tr>
      <tr>
        <td>Theory</td>
        <td>C+</td>
        <td>B+</td>
    </tr>
    <tr>
        <td rowspan="2">English</td>
        <td>Practical</td>
        <td>D</td>
        <td>A-</td>
      </tr>
      <tr>
        <td>Theory</td>
        <td>B</td>
        <td>C</td>
      </tr>
      <tr style="border-radius: 12px;background-color: #72e47f;">
        <td>ALL SUBJECTS</td>
        <td>TOTAL</td>
        <td>A-</td>
        <td>B+</td>
      </tr>
  </table>
</body>
</html>
